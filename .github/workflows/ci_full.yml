name: CI Full

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc-13
            cxx: g++-13
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-march=native"
            generator: Ninja
            asan: true
            coverage: false
          - os: ubuntu-latest
            cc: clang-18
            cxx: clang++-18
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-march=native"
            generator: Ninja
            asan: false
            coverage: true
          - os: windows-latest
            cc: clang-cl
            cxx: clang-cl
            cmake_args: -DCMAKE_BUILD_TYPE=Release
            generator: Ninja
            asan: false
            coverage: false
          - os: macos-latest
            cc: clang
            cxx: clang++
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-march=native"
            generator: Ninja
            asan: false
            coverage: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LLVM/Clang (Ubuntu)
        if: runner.os == 'Linux' && matrix.cxx == 'clang++-18'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-18 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-18 clang++-18 lld-18

      - name: Install GCC-13 (Ubuntu)
        if: runner.os == 'Linux' && matrix.cxx == 'g++-13'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-13 gcc-13

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y cmake ninja-build lcov gcovr
          sudo apt-get install -y libc++-dev libc++abi-dev || true

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja lcov || true

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja -y || true
          pip install gcovr || true

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ matrix.cc }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**') }}
          restore-keys: |
            build-${{ runner.os }}-${{ matrix.cc }}-
            build-${{ runner.os }}-

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G "${{ matrix.generator }}" ${{ matrix.cmake_args }} \
            -DOIL_BUILD_TESTS=ON \
            -DOIL_BUILD_BENCHMARKS=ON \
            -DOIL_BUILD_TOOLS=ON \
            -DOIL_AVX2=ON \
            -DCMAKE_CXX_STANDARD=20

      - name: Build
        run: cmake --build build

      - name: Quick tests
        timeout-minutes: 10
        run: |
          ctest --test-dir build --output-on-failure --timeout 120 \
            --exclude-regex "test_protected|test_gpu|test_training|test_native_oil|test_moe_training|paged_kv_1t_test"

      - name: ASAN/UBSAN build (Linux GCC)
        if: runner.os == 'Linux' && matrix.asan
        timeout-minutes: 30
        run: |
          cmake -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DOIL_BUILD_TESTS=ON \
            -DOIL_AVX2=ON
          cmake --build build-asan --parallel 2>&1
          ctest --test-dir build-asan --output-on-failure --timeout 120 \
            --exclude-regex "test_protected|test_gpu|test_training|paged_kv_1t_test" 2>&1

      - name: Code coverage (Linux Clang)
        if: runner.os == 'Linux' && matrix.coverage
        timeout-minutes: 15
        run: |
          cmake -B build-cov -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-instr-generate -fcoverage-mapping" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DOIL_BUILD_TESTS=ON \
            -DOIL_AVX2=ON
          cmake --build build-cov
          ctest --test-dir build-cov --output-on-failure --timeout 120 \
            --exclude-regex "test_protected|test_gpu|test_training|paged_kv_1t_test"
          llvm-profdata merge -sparse build-cov/**/*.profraw -o coverage.profdata 2>/dev/null || true

      - name: Performance benchmarks
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          cmake --build build --target bench_kernels 2>/dev/null || true
          if [ -f ./build/bench/bench_kernels ]; then
            ./build/bench/bench_kernels 2>&1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ runner.os }}-${{ matrix.cc }}
          path: |
            build/tools/
            build/tests/
            build/bench/

  clang-tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18 ninja-build cmake
      - name: Run clang-tidy
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_CLANG_TIDY="clang-tidy-18" -DOIL_BUILD_TESTS=ON -DOIL_AVX2=ON 2>&1 | tail -20
          cmake --build build 2>&1 | head -100 || true

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t InNova-cpp:ci .
      - name: Test Docker image
        run: |
          docker run --rm InNova-cpp:ci --help 2>&1 || true
