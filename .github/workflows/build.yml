name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    name: "Windows / MSVC"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DQUANT_BUILD_TESTS=ON
          -DQUANT_BUILD_BENCHMARKS=OFF
          -DQUANT_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-x64
          path: |
            build/Release/*.exe
            build/Release/*.lib
          retention-days: 14

  build-ubuntu-gcc:
    name: "Ubuntu / GCC-13"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13

      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        run: >
          cmake -S . -B build-gcc
          -DCMAKE_BUILD_TYPE=Release
          -DQUANT_BUILD_TESTS=ON
          -DQUANT_BUILD_BENCHMARKS=OFF
          -DQUANT_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build-gcc --parallel $(nproc)

      - name: Test
        working-directory: build-gcc
        run: ctest --output-on-failure

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-gcc13
          path: |
            build-gcc/Release/*
            build-gcc/*
          retention-days: 14
          include-hidden-files: false

  build-ubuntu-clang:
    name: "Ubuntu / Clang-18"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: >
          cmake -S . -B build-clang
          -DCMAKE_BUILD_TYPE=Release
          -DQUANT_BUILD_TESTS=ON
          -DQUANT_BUILD_BENCHMARKS=OFF
          -DQUANT_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build-clang --parallel $(nproc)

      - name: Test
        working-directory: build-clang
        run: ctest --output-on-failure

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-clang18
          path: |
            build-clang/Release/*
            build-clang/*
          retention-days: 14
          include-hidden-files: false
